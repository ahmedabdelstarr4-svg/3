<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0b1220"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>ÍÇÓÈÉ ÇáÔíÝÊ æÇáÈÕãÉ ÇáÐßíÉ</title>
<style>:root{--bg:#eef3f9; --surface:#fff; --surface-2:#f7f9fc; --surface-3:#edf3fa;--text:#142033; --muted:#718096; --line:#e2e8f0;--blue:#1677ff; --green:#18b663; --purple:#8b5cf6;--shadow:0 12px 35px rgba(15,23,42,.08);--soft-shadow:0 5px 18px rgba(15,23,42,.06);}body.dark-mode{--bg:#080d17; --surface:#111827; --surface-2:#151f2e; --surface-3:#1b293c;--text:#f1f5f9; --muted:#94a3b8; --line:#293548;--blue:#3d9bff; --green:#25d366;--shadow:0 15px 40px rgba(0,0,0,.35);--soft-shadow:0 5px 18px rgba(0,0,0,.25);}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{min-height:100%}body{margin:0;min-height:100vh;padding:12px 10px 25px;font-family:Tahoma,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 90% 0%,rgba(22,119,255,.18),transparent 30%),radial-gradient(circle at 0% 100%,rgba(139,92,246,.10),transparent 25%),var(--bg);transition:background .3s,color .3s;}.container{width:100%;max-width:520px;margin:auto;position:relative}
/* ===== TOP BAR ===== */.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;padding:5px 2px}.app-brand{display:flex;align-items:center;gap:10px}.app-icon{width:43px;height:43px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;background:linear-gradient(145deg,#2993ff,#075dcc);box-shadow:0 7px 18px rgba(22,119,255,.25);}.app-name{text-align:right}.app-name strong{display:block;font-size:15px;font-weight:900}.app-name span{display:block;margin-top:2px;font-size:10px;color:var(--muted)}.theme-toggle{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:19px;box-shadow:var(--soft-shadow);cursor:pointer;transition:.2s;}.theme-toggle:active{transform:scale(.91)}
/* ===== CLOCK ===== */.current-clock{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:bold;margin-bottom:16px;}.current-clock::before{content:"?";color:var(--green);font-size:9px;animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
/* ===== CARD ===== */.main-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:17px;box-shadow:var(--shadow);overflow:hidden;position:relative;}.main-card::before{content:"";position:absolute;top:0;right:0;left:0;height:4px;background:linear-gradient(90deg,#1677ff,#8b5cf6,#18b663);}
/* ===== SETUP ===== */.setup-header{padding:12px 5px 17px;text-align:center}.setup-hero{width:82px;height:82px;margin:4px auto 13px;border-radius:25px;display:flex;align-items:center;justify-content:center;font-size:39px;background:linear-gradient(145deg,#e8f2ff,#d9eaff);box-shadow:0 12px 25px rgba(22,119,255,.13);}body.dark-mode .setup-hero{background:linear-gradient(145deg,#172b46,#13233a)}.setup-title{font-size:21px;font-weight:900;margin-bottom:5px}.setup-subtitle{color:var(--muted);font-size:12px;line-height:1.7}
/* ===== FORM ===== */.form-card{background:var(--surface-2);border:1px solid var(--line);border-radius:19px;padding:14px;margin-bottom:12px}.form-label{font-size:12px;color:var(--muted);font-weight:bold;margin-bottom:9px;text-align:right}.input-row{display:grid;grid-template-columns:1fr 1.15fr .8fr 1fr;gap:6px;margin-bottom:5px}input[type="number"],select{width:100%;min-width:0;height:48px;padding:0 4px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font-size:14px;font-weight:900;text-align:center;outline:none;transition:.2s;}input[type="number"]:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,119,255,.10);}
/* ===== BUTTONS ===== */.btn{width:100%;min-height:50px;border:0;border-radius:14px;color:#fff;font-size:14px;font-weight:900;cursor:pointer;margin-top:8px;transition:transform .15s,filter .15s;box-shadow:0 7px 16px rgba(0,0,0,.10);}.btn:active{transform:scale(.975);filter:brightness(.94)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}.btn-green{background:linear-gradient(135deg,#20c76b,#11964e)}.btn-blue{background:linear-gradient(135deg,#2993ff,#075dcc)}.btn-orange{background:linear-gradient(135deg,#ffb52e,#e78b00)}.btn-stop{background:linear-gradient(135deg,#f35b5b,#dc2626)}.btn-icon{display:flex;align-items:center;justify-content:center;gap:9px}.btn-icon span{font-size:19px}
/* ===== TRACKER ===== */.tracker-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.shift-label{color:var(--muted);font-size:11px;font-weight:bold}.start-time{font-size:16px;font-weight:900;margin-top:3px}.start-time span{color:var(--green)}.live-dot{display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:20px;background:var(--surface-3);color:var(--muted);font-size:10px;font-weight:900;}.live-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(24,182,99,.12);}
/* ===== TIMER ===== */.timer-hero{position:relative;min-height:285px;border-radius:23px;background:linear-gradient(145deg,#0c1728,#12243d);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;margin-bottom:13px;box-shadow:0 15px 30px rgba(7,25,50,.20);}.timer-hero::before{content:"";position:absolute;width:270px;height:270px;border-radius:50%;border:1px solid rgba(255,255,255,.06)}.timer-hero::after{content:"";position:absolute;width:205px;height:205px;border-radius:50%;border:1px solid rgba(255,255,255,.05)}.progress-ring{width:235px;height:235px;position:relative;display:flex;align-items:center;justify-content:center}.progress-ring svg{position:absolute;width:235px;height:235px;transform:rotate(-90deg)}.progress-ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:9}.progress-ring-value{fill:none;stroke:url(#progressGradient);stroke-width:9;stroke-linecap:round;stroke-dasharray:565;stroke-dashoffset:565;transition:stroke-dashoffset .7s ease;}.timer-content{position:relative;z-index:3;text-align:center}.timer-caption{font-size:11px;color:rgba(255,255,255,.65);margin-bottom:5px}.time-display{direction:ltr;font-size:34px;letter-spacing:1px;font-weight:900;line-height:1;text-shadow:0 3px 15px rgba(0,0,0,.35)}.timer-under{font-size:11px;color:rgba(255,255,255,.55);margin-top:9px}
/* ===== STATUS ===== */.status-badge{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:32px;padding:7px 13px;border-radius:30px;font-size:11px;font-weight:900;margin-bottom:11px;transition:.3s;}.status-normal{background:#fff4ce;color:#966b00;border:1px solid #f4d76e}.status-break{background:#eee5ff;color:#7040b5;border:1px solid #d5c0ff}.status-done{background:#dcfce7;color:#15803d;border:1px solid #a7efbf}body.dark-mode .status-normal{background:#3a3219;color:#f6d45c;border-color:#64551e}body.dark-mode .status-break{background:#302043;color:#c6a2ff;border-color:#513870}body.dark-mode .status-done{background:#12351f;color:#5fe18a;border-color:#246239}
/* ===== INFO ===== */.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}.info-card{background:var(--surface-2);border:1px solid var(--line);border-radius:15px;padding:12px 5px;text-align:center;box-shadow:var(--soft-shadow);}.info-card-icon{font-size:17px;margin-bottom:4px}.info-card-title{color:var(--muted);font-size:9px;font-weight:bold}.info-card-value{color:var(--blue);font-size:12px;font-weight:900;margin-top:5px;white-space:nowrap}
/* ===== BREAK ===== */.break-box{display:none;padding:13px;margin-bottom:10px;border-radius:17px;background:linear-gradient(135deg,rgba(139,92,246,.10),var(--surface-2));border:1px dashed rgba(139,92,246,.55);}.break-title{color:var(--purple);font-weight:900;font-size:13px;margin-bottom:8px}
/* ===== ACTIONS ===== */.action-area{background:var(--surface-2);border:1px solid var(--line);padding:10px;border-radius:18px;margin-top:4px}.action-note{text-align:center;color:var(--muted);font-size:9px;margin-top:9px}
@media(max-width:390px){body{padding:7px 7px 18px}.main-card{padding:13px;border-radius:22px}.app-name strong{font-size:14px}.setup-title{font-size:19px}.setup-hero{width:72px;height:72px;font-size:34px}.timer-hero{min-height:260px}.progress-ring,.progress-ring svg{width:215px;height:215px}.time-display{font-size:29px}.info-card{padding:10px 2px}.info-card-value{font-size:11px}}</style></head><body><div class="container">
